name: scanner

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (UTC); 5 is the minimum
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Save state
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
